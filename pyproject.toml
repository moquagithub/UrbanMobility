[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bicyclelane"
version = "0.1.0"
description = "Detection of opportunities to build new bicycle lanes in a city (BicycleLane v1)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "BicycleLane team" }]
dependencies = [
    "osmnx>=2.0",
    "geopandas>=1.0",
    "shapely>=2.0",
    "networkx>=3.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "folium>=0.16",
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# DEM/elevation support for the relief detector (BL-23); off by default, opt in
# with the BICYCLELANE_DEM env var. Install with: pip install -e ".[dem]"
dem = ["rasterio>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
