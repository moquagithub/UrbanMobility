# nginx/nginx.conf
# ==================
# Reverse-proxy (DQE-12) : unifie frontend (Next.js) et backend (FastAPI)
# sous UNE seule origine. Le frontend appelle l'API en URLs relatives
# (NEXT_PUBLIC_API_URL="" dans docker-compose.yml) : plus de CORS
# cross-origin à gérer, et le déploiement reste valable quel que soit le
# nom d'hôte réel de l'application.

events {
    worker_connections 1024;
}

http {
    sendfile on;
    client_max_body_size 55M;  # marge au-dessus de MAX_UPLOAD_SIZE_MB (50 Mo, backend/app/core/config.py)

    upstream backend_upstream {
        server backend:8000;
    }

    upstream frontend_upstream {
        server frontend:3000;
    }

    server {
        listen 80;

        # ── API FastAPI (données, docs) ──────────────────────────────────
        location ~ ^/(api|docs|redoc|openapi\.json) {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Frontend Next.js (tout le reste) ─────────────────────────────
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Upgrade/Connection : sans effet avec `next start` (pas de HMR en
            # prod) mais inoffensif à garder si `next dev` est un jour proxifié.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
