# /etc/nginx/sites-available/eda.yourcompany.com
# Enterprise DGX Reverse Proxy with SSL (Zero Authorization)

server {
    listen 80;
    server_name eda.yourcompany.com;

    # Redirect HTTP traffic to HTTPS (or managed by certbot)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name eda.yourcompany.com;

    # SSL certificates (configured via: certbot --nginx -d eda.yourcompany.com)
    # ssl_certificate /etc/letsencrypt/live/eda.yourcompany.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/eda.yourcompany.com/privkey.pem;

    client_max_body_size 100M;

    # FastAPI API and Swagger Documentation
    location ~ ^/(api|docs|redoc|openapi\.json) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Next.js Frontend
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
