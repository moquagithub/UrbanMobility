# .github/workflows/ci.yml
# =========================
# CI (DQE-12) : lint + tests backend/frontend sur chaque PR, cohérent avec le
# gitflow du projet (branches main/develop comme lignes d'intégration).
#
# Les deux jobs tournent en parallèle et sont indépendants — un job frontend
# ne doit pas être bloqué par le backend (et inversement).

name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Annule les exécutions précédentes de CI d'une même PR quand un nouveau
# commit est poussé — évite de faire tourner des jobs devenus obsolètes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poc/backend
    env:
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: poc/backend/requirements.txt

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest tests/ -v

  frontend:
    name: Frontend (lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poc/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: poc/frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Tests (Vitest)
        run: npm test

      - name: Build de production
        # Valide le typage TypeScript et détecte les régressions de build —
        # NEXT_PUBLIC_API_URL vide (comportement du build Docker réel, voir
        # frontend/Dockerfile) : les fetchs deviennent des chemins relatifs.
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ""

  e2e:
    name: Tests end-to-end (Playwright)
    runs-on: ubuntu-latest
    # NON BLOQUANT pour l'instant : cette suite (DQE-13) a été écrite mais
    # n'a jamais pu être exécutée par son auteur (pas d'accès réseau au CDN
    # de binaires navigateur de Playwright dans l'environnement de
    # développement — voir frontend/playwright.config.ts et README §12.6).
    # `continue-on-error` évite de bloquer les PR sur une suite non encore
    # validée en conditions réelles ; à retirer une fois la première
    # exécution en CI confirmée fiable.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: poc/backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: poc/frontend/package-lock.json

      - name: Démarrer le backend
        working-directory: poc/backend
        env:
          CORS_ALLOWED_ORIGINS: http://localhost:3000
        run: |
          pip install -r requirements.txt
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &
          npx --yes wait-on@7 -t 30000 http://localhost:8000/api/v1/health

      - name: Builder et démarrer le frontend
        working-directory: poc/frontend
        env:
          # Pas de nginx dans ce job (contrairement à docker-compose, DQE-12) —
          # le frontend appelle directement le backend sur son port exposé,
          # comme en développement local sans Docker (voir README §1).
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: |
          npm ci
          npm run build
          nohup npm run start -- -p 3000 > /tmp/frontend.log 2>&1 &
          npx --yes wait-on@7 -t 30000 http://localhost:3000

      - name: Installer les navigateurs Playwright
        working-directory: poc/frontend
        run: npx playwright install --with-deps chromium

      - name: Tests end-to-end
        working-directory: poc/frontend
        run: npm run test:e2e

      - name: Publier le rapport Playwright (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: poc/frontend/playwright-report/
          retention-days: 7
